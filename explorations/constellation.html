<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Constellation</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #06070b;
    --ink: #ebe7de;
    --dim: rgba(235, 231, 222, 0.34);
    --faint: rgba(235, 231, 222, 0.14);
    --gold: #e9cb8b;
    --serif: "Newsreader", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; cursor: none; }
  body.sky canvas { cursor: grab; }

  #text {
    position: fixed; left: 50%; top: 50%; width: min(600px, 84vw);
    transform: translate(-50%, -50%);
    font-size: 23px; line-height: 2.35; font-weight: 300; letter-spacing: 0.005em;
    pointer-events: none; text-wrap: pretty;
    transition: top 1.2s cubic-bezier(.2,.7,.1,1), font-size 1.2s cubic-bezier(.2,.7,.1,1), opacity .6s;
  }
  body.sky #text { top: 84%; font-size: 17px; line-height: 1.9; }

  .slot { position: relative; transition: color .4s; }
  .slot.changed { color: #fff; }
  .slot .w { display: inline; animation: settle .9s cubic-bezier(.2,.7,.1,1); }
  .slot.pending .w { color: var(--dim); text-decoration: underline dotted rgba(233,203,139,.55); text-underline-offset: 6px; }
  .ghost {
    position: absolute; left: 0; top: 0.05em; white-space: nowrap;
    font-style: italic; font-size: .66em; line-height: 1; color: var(--gold);
    opacity: 0; transform: translateY(calc(-100% + 4px)); transition: opacity .25s, transform .25s;
  }
  .slot.pending .ghost { opacity: .95; transform: translateY(-100%); }
  body.sky .ghost { display: none; }
  @keyframes settle { from { opacity: 0; filter: blur(7px); } to { opacity: 1; filter: blur(0); } }

  .hud { position: fixed; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--dim); pointer-events: none; }
  #brand { top: 26px; left: 30px; }
  #brand b { color: var(--ink); font-weight: 400; }
  #depth { top: 26px; right: 30px; text-align: right; display: grid; gap: 9px; }
  #depth div { transition: color .5s; }
  #depth div.on { color: var(--ink); }
  #depth div::after { content: "  ○"; }
  #depth div.on::after { content: "  ●"; }
  #hint { bottom: 26px; left: 50%; transform: translateX(-50%); white-space: nowrap; transition: opacity .6s; }
  #title { top: 26px; left: 50%; transform: translateX(-50%); color: var(--ink); opacity: 0; transition: opacity 1.2s .4s; }
  body.sky #title { opacity: .8; }
  body.sky #depth { opacity: 0; transition: opacity .6s; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="text"></div>
<div class="hud" id="brand"><b>feeling</b> · constellation prototype</div>
<div class="hud" id="depth"></div>
<div class="hud" id="title"></div>
<div class="hud" id="hint"></div>

<script>
const LAYERS = [
  { name: "tone", tint: [244, 239, 228], moods: ["confident", "warm", "formal", "humble"].map((id) => ({ id, label: id })) },
  { name: "focus", tint: [168, 195, 255], moods: ["leadership", "craft", "curiosity", "impact"].map((id) => ({ id, label: id })) },
  { name: "your notes", tint: [240, 207, 138], moods: [
    { id: "thesis", label: "thesis · urban data" },
    { id: "lumen", label: "Lumen · side project" },
    { id: "nord", label: "letter to Studio Nord" },
  ] },
];

const SLOTS = {
  built: { base: "built", v: { confident: "designed and shipped", formal: "developed", leadership: "led the creation of", craft: "carefully crafted", impact: "shipped" } },
  tools: { base: "data tools", v: { craft: "precise data pipelines", impact: "tools people relied on daily", curiosity: "experimental data tools", thesis: "tools for messy city data", lumen: "data tools like Lumen" } },
  small: { base: "small", v: { warm: "close-knit", formal: "multidisciplinary", curiosity: "restless" } },
  think: { base: "I think I could", v: { confident: "I know I can", warm: "I would love to", formal: "I am confident I can", humble: "I believe I could" } },
  help: { base: "help", v: { impact: "make a measurable difference at", leadership: "lead change at", craft: "build thoughtfully for", curiosity: "explore new problems with", thesis: "bring my research rigor to", nord: "contribute to" } },
  learned: { base: "learned to work with", v: { warm: "learned to truly listen to", leadership: "learned to lead", confident: "know how to work with", curiosity: "keep learning from", lumen: "learned, building Lumen, to work with" } },
  fields: { base: "different fields", v: { warm: "very different backgrounds", formal: "diverse disciplines", curiosity: "fields I knew nothing about" } },
  hopeful: { base: "hopeful", v: { confident: "certain", warm: "excited", formal: "confident", nord: "convinced" } },
  useful: { base: "would be useful", v: { confident: "will matter", impact: "will create real value", warm: "could mean a lot", craft: "would serve the work well", formal: "would be of value", humble: "might be useful" } },
};

const PARTS = ["For three years I have ", "built", " ", "tools", " for a ", "small", " research team. ", "think", " ", "help",
  " your company, because I ", "learned", " people from ", "fields", ", and I am ", "hopeful", " that this experience ", "useful", " in the role."];

const FALLOFF = 0.75;
const THRESHOLD = 0.35;
const LATER_LAYER_BONUS = 0.15;

const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
const textEl = document.getElementById("text");
const depthEl = document.getElementById("depth");
const hintEl = document.getElementById("hint");
const titleEl = document.getElementById("title");

let W = 0, H = 0, DPR = 1;
let layer = 0;
let layerAnim = 0;
let stars = [];
let hover = null;
let mode = "edit";
let skyT = 0;
let angle = 0.5;
let drag = null;
let wheelAcc = 0;
let wheelLock = 0;
const dust = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 0.9 + 0.2, p: Math.random() * 6.28 }));

const slotEls = {};
buildText();
buildDepth();
resize();
addEventListener("resize", resize);
render();
requestAnimationFrame(frame);

function buildText() {
  for (const part of PARTS) {
    if (!SLOTS[part]) { textEl.append(part); continue; }
    const el = document.createElement("span");
    el.className = "slot";
    el.innerHTML = `<span class="w"></span><span class="ghost"></span>`;
    el.querySelector(".w").textContent = SLOTS[part].base;
    el.dataset.value = SLOTS[part].base;
    slotEls[part] = el;
    textEl.append(el);
  }
}

function buildDepth() {
  depthEl.innerHTML = LAYERS.map((l, i) => `<div data-i="${i}">${String(i + 1).padStart(2, "0")}  ${l.name}</div>`).reverse().join("");
}

function resize() {
  DPR = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

const radii = () => ({ rx: Math.min(W * 0.4, 560), ry: Math.min(H * 0.37, 340) });
const toScreen = (u, v) => { const { rx, ry } = radii(); return [W / 2 + u * rx, H / 2 + v * ry]; };
const toField = (x, y) => { const { rx, ry } = radii(); return [(x - W / 2) / rx, (y - H / 2) / ry]; };

function anchorsOf(k) {
  const moods = LAYERS[k].moods;
  const start = moods.length === 4 ? -Math.PI * 0.75 : -Math.PI / 2;
  return moods.map((mood, i) => {
    const a = start + (i * Math.PI * 2) / moods.length;
    return { mood, u: Math.cos(a), v: Math.sin(a) };
  });
}

function weightsAt(k, u, v) {
  const w = {};
  for (const a of anchorsOf(k)) w[a.mood.id] = Math.exp(-((Math.hypot(u - a.u, v - a.v) / FALLOFF) ** 2));
  return w;
}

function textFor(starList) {
  const score = {};
  for (const s of starList) for (const [id, w] of Object.entries(s.w)) score[id] = (score[id] || 0) + w * (1 + LATER_LAYER_BONUS * s.layer);
  const out = {};
  for (const [id, slot] of Object.entries(SLOTS)) {
    let best = null, bestScore = THRESHOLD;
    for (const mood of Object.keys(slot.v)) if ((score[mood] || 0) >= bestScore) { best = mood; bestScore = score[mood]; }
    out[id] = best ? slot.v[best] : slot.base;
  }
  return out;
}

function hoverStar() {
  if (!hover || mode !== "edit") return null;
  const [u, v] = toField(hover.x, hover.y);
  return { u, v, layer, w: weightsAt(layer, u, v) };
}

function render() {
  const now = textFor(stars);
  const h = hoverStar();
  const preview = h ? textFor([...stars, h]) : now;
  for (const [id, el] of Object.entries(slotEls)) {
    if (el.dataset.value !== now[id]) {
      el.dataset.value = now[id];
      const w = document.createElement("span");
      w.className = "w";
      w.textContent = now[id];
      el.querySelector(".w").replaceWith(w);
    }
    el.classList.toggle("changed", now[id] !== SLOTS[id].base);
    const pending = preview[id] !== now[id];
    el.classList.toggle("pending", pending);
    if (pending) el.querySelector(".ghost").textContent = preview[id];
  }
  for (const d of depthEl.children) d.classList.toggle("on", +d.dataset.i === layer);
  hintEl.textContent = mode === "edit"
    ? "click to place a star  ·  scroll ↑ next layer  ·  scroll ↓ back  ·  ↵ accept"
    : "drag to turn the constellation  ·  esc to keep shaping";
  titleEl.textContent = constellationName();
}

function constellationName() {
  const total = {};
  for (const s of stars) for (const [id, w] of Object.entries(s.w)) total[id] = (total[id] || 0) + w;
  const top = LAYERS.map((l) => l.moods.filter((m) => (total[m.id] || 0) >= THRESHOLD).sort((a, b) => total[b.id] - total[a.id])[0]).filter(Boolean);
  return top.length ? top.map((m) => m.id).join("  ·  ") : "an unshaped paragraph";
}

function frame(t) {
  layerAnim += (layer - layerAnim) * 0.09;
  skyT += ((mode === "sky" ? 1 : 0) - skyT) * 0.045;
  if (mode === "sky" && !drag) angle += 0.0022;
  draw(t / 1000);
  requestAnimationFrame(frame);
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  for (const d of dust) {
    ctx.fillStyle = `rgba(235,231,222,${0.05 + 0.06 * Math.sin(time * 0.6 + d.p) ** 2})`;
    ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r, 0, 6.28); ctx.fill();
  }

  const placed = stars.map((s) => ({ s, ...placeStar(s) }));
  const ordered = [...placed].sort((a, b) => a.s.layer - b.s.layer || a.s.born - b.s.born);

  ctx.lineWidth = 0.7;
  for (let i = 1; i < ordered.length; i++) {
    const a = ordered[i - 1], b = ordered[i];
    const sameLayer = a.s.layer === b.s.layer;
    const alpha = Math.min(a.alpha, b.alpha) * (sameLayer ? 0.42 : 0.3 * skyT);
    if (alpha < 0.01) continue;
    ctx.strokeStyle = `rgba(235,231,222,${alpha})`;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  if (skyT < 0.6) drawAnchors(1 - skyT / 0.6);

  for (const p of ordered) drawStar(p.x, p.y, p.size, p.alpha, LAYERS[p.s.layer].tint, time + p.s.born);

  const h = hoverStar();
  if (h && skyT < 0.05) drawCursor(h);
}

function placeStar(s) {
  const depth = layerAnim - s.layer;
  const shrink = Math.pow(0.8, Math.max(0, depth));
  const [ex, ey] = toScreen(s.u * shrink, s.v * shrink - Math.max(0, depth) * 0.06);
  const editAlpha = depth < -0.5 ? 0 : Math.pow(0.3, Math.max(0, depth));
  const editSize = 2.6 * shrink;

  const { rx, ry } = radii();
  const zGap = 210;
  const X = s.u * rx * 0.85, Y = s.v * ry * 0.85, Z = (s.layer - (LAYERS.length - 1) / 2) * zGap;
  const x1 = X * Math.cos(angle) + Z * Math.sin(angle);
  const z1 = -X * Math.sin(angle) + Z * Math.cos(angle);
  const persp = 1000 / (1000 + z1);
  const sx = W / 2 + x1 * persp * 0.8, sy = H * 0.4 + Y * persp * 0.8;

  const e = skyT * skyT * (3 - 2 * skyT);
  return {
    x: ex + (sx - ex) * e,
    y: ey + (sy - ey) * e,
    size: editSize + (2.4 * persp - editSize) * e,
    alpha: editAlpha + (Math.min(1, 0.45 + 0.55 * persp) - editAlpha) * e,
  };
}

function drawStar(x, y, size, alpha, [r, g, b], t) {
  if (alpha < 0.01) return;
  const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 9);
  glow.addColorStop(0, `rgba(${r},${g},${b},${0.32 * alpha})`);
  glow.addColorStop(1, `rgba(${r},${g},${b},0)`);
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(x, y, size * 9, 0, 6.28); ctx.fill();
  const twinkle = 0.85 + 0.15 * Math.sin(t * 2.1);
  ctx.fillStyle = `rgba(${r},${g},${b},${alpha * twinkle})`;
  ctx.beginPath(); ctx.arc(x, y, size, 0, 6.28); ctx.fill();
  ctx.strokeStyle = `rgba(${r},${g},${b},${0.35 * alpha})`;
  ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(x - size * 3.2, y); ctx.lineTo(x + size * 3.2, y); ctx.moveTo(x, y - size * 3.2); ctx.lineTo(x, y + size * 3.2); ctx.stroke();
}

function drawAnchors(visibility) {
  const h = hoverStar();
  ctx.font = "300 11px 'IBM Plex Mono', monospace";
  ctx.textAlign = "center";
  LAYERS.forEach((L, k) => {
    const presence = Math.max(0, 1 - Math.abs(layerAnim - k) * 1.6) * visibility;
    if (presence < 0.01) return;
    const scale = 1 + (layerAnim - k) * 0.12;
    for (const a of anchorsOf(k)) {
      const [x, y] = toScreen(a.u * scale, a.v * scale);
      const pull = h && k === layer ? h.w[a.mood.id] : 0;
      const [r, g, b] = L.tint;
      ctx.strokeStyle = `rgba(${r},${g},${b},${(0.22 + 0.6 * pull) * presence})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(x, y, 4 + 3 * pull, 0, 6.28); ctx.stroke();
      ctx.fillStyle = `rgba(${r},${g},${b},${(0.3 + 0.7 * pull) * presence})`;
      ctx.fillText(a.mood.label, x, y + (a.v < 0 ? -16 : 24));
    }
  });
}

function drawCursor(h) {
  const [r, g, b] = LAYERS[layer].tint;
  for (const a of anchorsOf(layer)) {
    const w = h.w[a.mood.id];
    if (w < 0.04) continue;
    const [ax, ay] = toScreen(a.u, a.v);
    const line = ctx.createLinearGradient(hover.x, hover.y, ax, ay);
    line.addColorStop(0, `rgba(${r},${g},${b},${0.55 * w})`);
    line.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.strokeStyle = line;
    ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(hover.x, hover.y); ctx.lineTo(ax, ay); ctx.stroke();
  }
  const strength = Math.max(...Object.values(h.w));
  ctx.strokeStyle = `rgba(${r},${g},${b},0.5)`;
  ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.arc(hover.x, hover.y, 5 + 14 * strength, 0, 6.28); ctx.stroke();
  ctx.fillStyle = `rgba(${r},${g},${b},0.9)`;
  ctx.beginPath(); ctx.arc(hover.x, hover.y, 1.4, 0, 6.28); ctx.fill();
}

canvas.addEventListener("mousemove", (e) => {
  if (drag) { angle = drag.angle + (e.clientX - drag.x) * 0.006; return; }
  hover = { x: e.clientX, y: e.clientY };
  render();
});
canvas.addEventListener("mouseleave", () => { hover = null; render(); });
canvas.addEventListener("mousedown", (e) => { if (mode === "sky") { drag = { x: e.clientX, angle }; canvas.style.cursor = "grabbing"; } });
addEventListener("mouseup", () => { drag = null; canvas.style.cursor = ""; });

canvas.addEventListener("click", (e) => {
  if (mode !== "edit") return;
  const near = stars.find((s) => s.layer === layer && Math.hypot(...toScreen(s.u, s.v).map((c, i) => c - [e.clientX, e.clientY][i])) < 12);
  if (near) stars = stars.filter((s) => s !== near);
  else {
    const [u, v] = toField(e.clientX, e.clientY);
    stars.push({ u, v, layer, w: weightsAt(layer, u, v), born: performance.now() / 1000 });
  }
  render();
});

addEventListener("wheel", (e) => {
  if (mode !== "edit" || performance.now() < wheelLock) return;
  wheelAcc += e.deltaY;
  if (Math.abs(wheelAcc) < 60) return;
  goToLayer(layer + (wheelAcc < 0 ? 1 : -1));
  wheelAcc = 0;
  wheelLock = performance.now() + 650;
}, { passive: true });

addEventListener("keydown", (e) => {
  if (e.key === "Enter") { mode = "sky"; document.body.classList.add("sky"); hover = null; render(); }
  if (e.key === "Escape") { mode = "edit"; document.body.classList.remove("sky"); render(); }
  if (mode !== "edit") return;
  if (e.key === "ArrowUp") goToLayer(layer + 1);
  if (e.key === "ArrowDown") goToLayer(layer - 1);
  if (e.key === "Backspace") {
    const mine = stars.filter((s) => s.layer === layer);
    if (mine.length) stars = stars.filter((s) => s !== mine[mine.length - 1]);
    render();
  }
});

function goToLayer(k) {
  layer = Math.max(0, Math.min(LAYERS.length - 1, k));
  render();
}
</script>
</body>
</html>
