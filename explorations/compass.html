<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #06070b;
    --ink: #ebe7de;
    --dim: rgba(235, 231, 222, 0.4);
    --faint: rgba(235, 231, 222, 0.16);
    --gold: #e9cb8b;
    --serif: "Newsreader", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font-family: var(--serif); -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; }

  #text {
    position: fixed; left: 50%; top: 50%; width: min(620px, 84vw); transform: translate(-50%, -50%);
    font-size: clamp(17px, 0.9vw + 11px, 23px); line-height: 2.15; font-weight: 300; text-wrap: pretty; z-index: 1;
    transition: top 1.2s cubic-bezier(.2,.7,.1,1), font-size 1.2s cubic-bezier(.2,.7,.1,1), color .35s;
  }
  #text::selection, #text *::selection { background: rgba(233, 203, 139, 0.22); }
  body.dragging #text { color: rgba(235, 231, 222, 0.16); user-select: none; }
  body.dragging { cursor: none; }
  body.sky #text { top: 82%; font-size: 17px; line-height: 1.9; user-select: none; }

  .seg { cursor: grab; text-decoration: underline dotted rgba(233,203,139,.45); text-underline-offset: 7px; transition: color .3s, text-shadow .3s; }
  .seg.pending { background: rgba(233, 203, 139, 0.1); border-radius: 3px; text-decoration-color: var(--gold); animation: invite 2.2s ease-in-out infinite; }
  .seg.focus { text-decoration-color: var(--gold); }
  body.dragging .seg.live { color: var(--ink); text-decoration: none; background: none; animation: none; }
  body.sky .seg { text-decoration: none; background: none; animation: none; cursor: default; }
  .seg .new { color: var(--gold); transition: text-shadow .25s; }
  .seg.lvl-2 .new { text-shadow: 0 0 10px rgba(233, 203, 139, 0.25); }
  .seg.lvl-3 .new { text-shadow: 0 0 14px rgba(233, 203, 139, 0.5); }
  .seg.loading { animation: breathe 1.4s ease-in-out infinite; }
  @keyframes invite { 50% { background: rgba(233, 203, 139, 0.2); } }
  @keyframes breathe { 50% { opacity: .35; } }

  .label { position: fixed; transform: translate(-50%, -50%); z-index: 3; pointer-events: none; text-align: center; white-space: nowrap;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; color: var(--dim); transition: color .12s, opacity .2s; }
  .label .key { color: rgba(235, 231, 222, 0.22); margin-right: 6px; }
  .label .dots { display: block; margin-top: 4px; font-size: 9px; letter-spacing: .3em; color: var(--gold); opacity: 0; }
  .label.lead { color: var(--ink); }
  .label.lead .dots { opacity: 1; }
  .label.custom { font-style: italic; }

  #own { position: fixed; z-index: 4; display: none; background: rgba(6, 7, 11, 0.94); border: none; border-bottom: 1px solid var(--gold);
    color: var(--ink); font: italic 300 17px var(--serif); padding: 4px 2px; width: 240px; outline: none; }
  #own.show { display: block; }

  .hud { position: fixed; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--dim); z-index: 3; }
  #brand { top: 26px; left: 30px; }
  #brand b { color: var(--ink); font-weight: 400; }
  .corner { top: 22px; background: none; border: none; cursor: pointer; padding: 4px; color: var(--dim); font: 11px var(--mono); letter-spacing: .08em; }
  .corner:hover { color: var(--ink); }
  #edit { right: 26px; }
  #sound { right: 120px; }
  body.sky .corner, body.dragging .corner { opacity: 0; pointer-events: none; }
  #hint { bottom: 22px; left: 50%; transform: translateX(-50%); width: 92vw; text-align: center; line-height: 1.8; pointer-events: none; }
  #hint b { color: var(--ink); font-weight: 400; }
  #hint .k { color: var(--gold); }
  #toast { bottom: 64px; left: 50%; transform: translateX(-50%); color: #f0a58b; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #toast.show { opacity: 1; }

  #editor { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(620px, 84vw); height: 46vh; z-index: 1;
    background: transparent; color: var(--ink); border: 1px solid var(--faint); border-radius: 4px; padding: 18px;
    font: 300 20px/1.8 var(--serif); resize: none; outline: none; display: none; }
  body.editing #editor { display: block; }
  body.editing #text { display: none; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="text"></div>
<textarea id="editor" spellcheck="false"></textarea>
<div id="labels"></div>
<input id="own" placeholder="your own direction…" />
<div class="hud" id="brand"><b>feeling</b> · compass</div>
<button class="hud corner" id="sound"></button>
<button class="hud corner" id="edit">edit text</button>
<div class="hud" id="hint"></div>
<div class="hud" id="toast"></div>

<script>
const SAMPLE = "For three years I have built data tools for a small research team. I think I could help your company, because I learned to work with people from different fields, and I am hopeful that this experience would be useful in the role.";
const RINGS = [26, 68, 112];
const ANCHOR = 150;
const LEVEL_NAMES = ["", "slight", "medium", "strong"];
const BLEND_DEGREES = 13;
const MAX_DIRECTIONS = 5;
const NOTES = [261.63, 329.63, 392.0, 523.25, 440.0];

const $ = (id) => document.getElementById(id);
const canvas = $("sky"), ctx = canvas.getContext("2d");
const textEl = $("text"), labelsEl = $("labels"), ownEl = $("own"), hintEl = $("hint"), toastEl = $("toast");

let W = 0, H = 0;
let pieces = [{ kind: "plain", text: SAMPLE }];
let segs = {};
let nextId = 1;
let focusId = null;
let drag = null;
let mode = "edit";
let commitOrder = [];
let lastKey = null;
let skyT = 0, angle = 0.4, spin = null;
const dust = Array.from({ length: 150 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 0.9 + 0.2, p: Math.random() * 6.28 }));
const flashes = [];

const sound = createSound();
resize();
addEventListener("resize", resize);
renderAll();
requestAnimationFrame(frame);

function resize() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function focused() { return focusId != null ? segs[focusId] : null; }
function pieceText(p) { return p.kind === "plain" ? p.text : segs[p.id].current; }
function fullText() { return pieces.map(pieceText).join(""); }

function renderAll() { renderText(); renderLabels(); renderHint(); }

function renderText() {
  textEl.innerHTML = "";
  pieces.forEach((p, i) => {
    const span = document.createElement("span");
    span.dataset.p = i;
    if (p.kind === "plain") { span.textContent = p.text; textEl.append(span); return; }
    const seg = segs[p.id];
    const live = drag?.seg === seg;
    const shown = live ? previewOf(drag) : seg.current;
    const level = live ? drag.level : seg.choice?.level ?? 0;
    span.className = ["seg", !seg.choice && seg.current === seg.original && "pending", focusId === seg.id && "focus", live && "live", seg.loading && "loading", `lvl-${level}`].filter(Boolean).join(" ");
    span.dataset.seg = seg.id;
    for (const part of diffWords(seg.original, shown)) {
      const w = document.createElement("span");
      if (part.changed) w.className = "new";
      w.textContent = part.text;
      span.append(w);
    }
    textEl.append(span);
  });
}

function renderHint() {
  const seg = focused();
  if (mode === "sky") return (hintEl.innerHTML = "drag to turn your constellation  ·  <span class=k>esc</span> keep shaping");
  if (drag) return (hintEl.innerHTML = drag.level ? `release to keep <b>${esc(leadLabel(drag))} · ${LEVEL_NAMES[drag.level]}</b>  ·  back to the centre to cancel` : "pull toward a direction  ·  each ring is one step stronger");
  if (!seg) return (hintEl.innerHTML = "highlight a few words to begin  ·  click a shaped passage to reshape it  ·  <span class=k>↵</span> constellation");
  if (!seg.directions) return (hintEl.innerHTML = "reading the passage…");
  const keys = seg.directions.map((d, i) => `<span class=k>${i + 1}</span> ${esc(d.label)}`).join("   ");
  hintEl.innerHTML = `<b>press on the words and drag</b>  ·  ${keys}<br><span class=k>tab</span> other directions  ·  <span class=k>type</span> your own  ·  <span class=k>esc</span> done`;
}

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toastEl.classList.remove("show"), 4000);
}

textEl.addEventListener("mousedown", (e) => {
  if (mode !== "edit" || e.button !== 0) return;
  const segEl = e.target.closest(".seg");
  if (!segEl) return;
  e.preventDefault();
  getSelection().removeAllRanges();
  startDrag(segs[+segEl.dataset.seg], e.clientX, e.clientY);
});

textEl.addEventListener("mouseup", () => {
  if (mode !== "edit" || drag) return;
  const sel = getSelection();
  if (sel.isCollapsed) return;
  const range = sel.getRangeAt(0);
  const a = pieceOf(range.startContainer), b = pieceOf(range.endContainer);
  sel.removeAllRanges();
  if (a == null || b == null || a < 0 || a !== b || pieces[a].kind !== "plain") return toast("highlight within one stretch of plain text");
  const plain = pieces[a].text;
  const [s, t] = snapToWords(plain, Math.min(range.startOffset, range.endOffset), Math.max(range.startOffset, range.endOffset));
  if (t - s < 2) return;
  dropPendingFocus();
  const id = nextId++;
  segs[id] = { id, original: plain.slice(s, t), current: plain.slice(s, t), directions: null, choice: null };
  pieces.splice(a, 1, ...[s > 0 && { kind: "plain", text: plain.slice(0, s) }, { kind: "seg", id }, t < plain.length && { kind: "plain", text: plain.slice(t) }].filter(Boolean));
  focusId = id;
  renderAll();
  fetchDirections(segs[id], []);
});

function pieceOf(node) {
  const el = (node.nodeType === 3 ? node.parentElement : node).closest("[data-p]");
  return el && textEl.contains(el) && !el.closest(".seg") ? +el.dataset.p : el?.closest(".seg") ? -1 : null;
}

function snapToWords(text, s, t) {
  while (s > 0 && /\S/.test(text[s - 1])) s--;
  while (t < text.length && /[^\s.,;:!?]/.test(text[t])) t++;
  while (s < t && /\s/.test(text[s])) s++;
  while (t > s && /\s/.test(text[t - 1])) t--;
  return [s, t];
}

async function fetchDirections(seg, exclude) {
  const keep = (seg.directions ?? []).filter((d) => d.kind === "custom");
  seg.directions = null;
  renderAll();
  try {
    const { directions } = await api("bloom", { ...passageOf(seg), exclude });
    seg.directions = [...directions.slice(0, 4).map((d) => ({ ...d, kind: "suggested" })), ...keep].slice(0, MAX_DIRECTIONS);
  } catch (error) {
    toast(error.message);
    seg.directions = keep.length ? keep : null;
  }
  if (drag?.seg === seg) sound.voices(seg.directions?.length ?? 0);
  renderAll();
}

function passageOf(seg) {
  let offset = 0;
  for (const p of pieces) { if (p.kind === "seg" && p.id === seg.id) break; offset += pieceText(p).length; }
  const text = pieces.map((p) => (p.kind === "seg" && p.id === seg.id ? seg.original : pieceText(p))).join("");
  return { text, start: offset, end: offset + seg.original.length };
}

async function api(route, payload) {
  const { simulate } = await import("../src/llm/simulator.js");
  return simulate(route, payload);
}

function anglesFor(n) {
  const start = -Math.PI / 2 + Math.PI / n;
  return Array.from({ length: n }, (_, i) => start + (i * Math.PI * 2) / n);
}

function startDrag(seg, x, y) {
  focusId = seg.id;
  ownEl.classList.remove("show");
  sound.wake();
  drag = { seg, cx: x, cy: y, x, y, lead: null, second: null, level: 0, blend: false, weights: [] };
  document.body.classList.add("dragging");
  sound.voices(seg.directions?.length ?? 0);
  renderAll();
}

addEventListener("mousemove", (e) => {
  if (spin) { angle = spin.angle + (e.clientX - spin.x) * 0.006; return; }
  if (!drag) return;
  drag.x = e.clientX; drag.y = e.clientY;
  const before = { lead: drag.lead, level: drag.level, blend: drag.blend };
  steer(drag);
  sound.mix(drag.weights);
  if (drag.level !== before.level || drag.lead !== before.lead || drag.blend !== before.blend) {
    if (drag.level !== before.level && drag.level > 0) { sound.tick(drag.level); flashes.push({ r: RINGS[drag.level - 1], born: performance.now() }); }
    renderAll();
  }
});

function steer(d) {
  const dirs = d.seg.directions;
  const dx = d.x - d.cx, dy = d.y - d.cy, r = Math.hypot(dx, dy);
  d.level = r < RINGS[0] ? 0 : r < RINGS[1] ? 1 : r < RINGS[2] ? 2 : 3;
  if (!dirs?.length || !d.level) { d.lead = null; d.weights = []; d.blend = false; return; }
  const phi = Math.atan2(dy, dx);
  const angles = anglesFor(dirs.length);
  const gaps = angles.map((a) => Math.abs(Math.atan2(Math.sin(phi - a), Math.cos(phi - a))));
  const order = gaps.map((g, i) => [g, i]).sort((p, q) => p[0] - q[0]);
  d.lead = order[0][1];
  d.second = order[1]?.[1] ?? null;
  const sector = (Math.PI * 2) / dirs.length;
  d.blend = d.second != null && Math.abs(order[0][0] - order[1][0]) < (BLEND_DEGREES * Math.PI) / 180 && order[1][0] < sector;
  const strength = d.level / 3;
  const shares = gaps.map((g) => Math.max(0, Math.cos(g)) ** 4);
  const total = shares.reduce((s, v) => s + v, 0) || 1;
  d.weights = shares.map((s) => (strength * s) / total);
}

function previewOf(d) {
  if (!d.seg.directions || !d.level || d.lead == null) return d.seg.current;
  return d.seg.directions[d.lead][LEVEL_NAMES[d.level]];
}

function leadLabel(d) {
  const dirs = d.seg.directions;
  if (!dirs || d.lead == null) return "";
  return d.blend ? `${dirs[d.lead].label} + ${dirs[d.second].label}` : dirs[d.lead].label;
}

addEventListener("mouseup", async () => {
  spin = null;
  if (!drag) return;
  const d = drag;
  drag = null;
  document.body.classList.remove("dragging");
  sound.voices(0);
  if (!d.level || d.lead == null) { renderAll(); return; }
  await commit(d.seg, d.lead, d.level, { cx: d.cx, cy: d.cy, dx: d.x - d.cx, dy: d.y - d.cy }, d.blend ? d : null);
});

async function commit(seg, lead, level, at, blend) {
  const dir = seg.directions[lead];
  seg.current = dir[LEVEL_NAMES[level]];
  seg.choice = { label: blend ? leadLabel(blend) : dir.label, level, ...at };
  commitOrder = [...commitOrder.filter((id) => id !== seg.id), seg.id];
  sound.chime(level);
  renderAll();
  if (!blend) return;
  const pulls = blend.weights.map((w, i) => ({ label: seg.directions[i].label, weight: w })).filter((p) => p.weight > 0.08);
  seg.loading = true; renderText();
  try { seg.current = (await api("blend", { ...passageOf(seg), pulls })).text; }
  catch (error) { toast(error.message); }
  seg.loading = false; renderAll();
}

function anchorOf(seg) {
  const rects = segRects(seg);
  const last = rects.at(-1);
  return last ? { x: last.right, y: last.top + last.height / 2 } : { x: W / 2, y: H / 2 };
}

addEventListener("keydown", (e) => {
  if (document.body.classList.contains("editing") || e.target === ownEl) return;
  const seg = focused();
  if (e.key === "Escape") {
    if (mode === "sky") { mode = "edit"; document.body.classList.remove("sky"); renderAll(); return; }
    dropPendingFocus(); focusId = null; lastKey = null; renderAll(); return;
  }
  if (e.key === "Enter" && mode === "edit" && !drag) {
    if (!commitOrder.length) return toast("shape a passage first");
    mode = "sky"; focusId = null; document.body.classList.add("sky"); renderAll(); return;
  }
  if (!seg || drag || mode !== "edit") return;
  if (e.key === "Tab") {
    e.preventDefault();
    if (seg.directions) fetchDirections(seg, seg.directions.map((d) => d.label));
    return;
  }
  const n = Number(e.key);
  if (n >= 1 && n <= (seg.directions?.length ?? 0)) {
    sound.wake();
    const lead = n - 1;
    const level = lastKey?.lead === lead && lastKey.seg === seg.id ? (lastKey.level % 3) + 1 : 1;
    lastKey = { seg: seg.id, lead, level };
    const a = anchorOf(seg), angle = anglesFor(seg.directions.length)[lead], r = (RINGS[level - 1] + (RINGS[level] ?? ANCHOR)) / 2;
    sound.tick(level);
    commit(seg, lead, level, { cx: a.x, cy: a.y, dx: Math.cos(angle) * r, dy: Math.sin(angle) * r }, null);
    return;
  }
  if (e.key.length === 1 && /\p{L}/u.test(e.key) && !e.metaKey && !e.ctrlKey && seg.directions) {
    e.preventDefault();
    const a = anchorOf(seg);
    ownEl.style.left = `${clamp(a.x - 120, 12, W - 252)}px`;
    ownEl.style.top = `${a.y + 26}px`;
    ownEl.value = e.key;
    ownEl.classList.add("show");
    ownEl.focus();
  }
});

ownEl.addEventListener("keydown", async (e) => {
  if (e.key === "Escape") { ownEl.classList.remove("show"); return; }
  if (e.key !== "Enter" || !ownEl.value.trim()) return;
  const seg = focused(), label = ownEl.value.trim();
  ownEl.classList.remove("show");
  if (!seg) return;
  hintEl.textContent = `listening for “${label}”…`;
  try {
    const { direction } = await api("custom", { ...passageOf(seg), label });
    const custom = { ...direction, kind: "custom" };
    const dirs = seg.directions ?? [];
    seg.directions = dirs.length >= MAX_DIRECTIONS ? [...dirs.slice(0, MAX_DIRECTIONS - 1), custom] : [...dirs, custom];
    sound.chime(1);
  } catch (error) { toast(error.message); }
  renderAll();
});

function dropPendingFocus() {
  const seg = focused();
  if (seg && !seg.choice && seg.current === seg.original) removeSeg(seg.id);
}

function removeSeg(id) {
  const i = pieces.findIndex((p) => p.kind === "seg" && p.id === id);
  if (i < 0) return;
  pieces[i] = { kind: "plain", text: segs[id].current };
  delete segs[id];
  const merged = [];
  for (const p of pieces) {
    const last = merged[merged.length - 1];
    if (p.kind === "plain" && last?.kind === "plain") last.text += p.text;
    else merged.push({ ...p });
  }
  pieces = merged;
}

$("edit").addEventListener("click", () => {
  const editor = $("editor");
  if (document.body.classList.toggle("editing")) {
    editor.value = fullText(); editor.focus(); $("edit").textContent = "done";
  } else {
    pieces = [{ kind: "plain", text: editor.value.trim() || SAMPLE }];
    segs = {}; commitOrder = []; focusId = null;
    $("edit").textContent = "edit text";
    renderAll();
  }
});

$("sound").addEventListener("click", () => { sound.toggle(); renderSoundButton(); });
renderSoundButton();
function renderSoundButton() { $("sound").textContent = sound.muted ? "sound off" : "sound on"; }

addEventListener("mousedown", (e) => { if (mode === "sky") spin = { x: e.clientX, angle }; });

function renderLabels() {
  labelsEl.innerHTML = "";
  if (!drag?.seg.directions) return;
  const dirs = drag.seg.directions;
  anglesFor(dirs.length).forEach((a, i) => {
    const el = document.createElement("div");
    const isLead = i === drag.lead || (drag.blend && i === drag.second);
    el.className = "label" + (isLead ? " lead" : "") + (dirs[i].kind === "custom" ? " custom" : "");
    el.style.left = `${drag.cx + Math.cos(a) * (ANCHOR + 30)}px`;
    el.style.top = `${drag.cy + Math.sin(a) * (ANCHOR + 22)}px`;
    const dots = isLead ? "●".repeat(drag.level) + "○".repeat(3 - drag.level) : "";
    el.innerHTML = `<span class="key">${i + 1}</span>${esc(dirs[i].label)}<span class="dots">${dots}</span>`;
    labelsEl.append(el);
  });
}

function segRects(seg) {
  return [...textEl.querySelectorAll(`[data-seg="${seg.id}"]`)].flatMap((el) => [...el.getClientRects()]);
}

function frame(t) {
  const time = t / 1000;
  skyT += ((mode === "sky" ? 1 : 0) - skyT) * 0.05;
  if (mode === "sky" && !spin) angle += 0.0025;
  ctx.clearRect(0, 0, W, H);
  for (const d of dust) {
    ctx.fillStyle = `rgba(235,231,222,${0.05 + 0.06 * Math.sin(time * 0.6 + d.p) ** 2})`;
    ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.r, 0, 6.28); ctx.fill();
  }
  if (skyT > 0.01) drawConstellation(time);
  if (skyT < 0.99) {
    for (const seg of Object.values(segs)) if (seg.choice && drag?.seg !== seg) drawMark(seg, 1 - skyT);
    const f = focused();
    if (f && !f.choice && !drag) drawInvite(f, time);
    if (drag) drawCompass(drag, time);
  }
  requestAnimationFrame(frame);
}

function drawMark(seg, alpha) {
  const last = segRects(seg).at(-1);
  if (!last) return;
  const x = last.right + 9, y = last.top + last.height * 0.38;
  dot(x, y, 1.1 + 0.5 * seg.choice.level, 0.55 * alpha, true);
}

function drawInvite(seg, time) {
  const a = anchorOf(seg);
  const pulse = 0.5 + 0.5 * Math.sin(time * 3);
  ring(a.x + 14, a.y - 6, 4 + 3 * pulse, 0.25 + 0.35 * pulse, true);
}

function drawCompass(d, time) {
  const { cx, cy } = d;
  const now = performance.now();
  RINGS.forEach((r, i) => {
    const active = d.level === i + 1;
    ring(cx, cy, r, active ? 0.32 : 0.09, active);
  });
  for (let i = flashes.length - 1; i >= 0; i--) {
    const age = (now - flashes[i].born) / 500;
    if (age > 1) { flashes.splice(i, 1); continue; }
    ring(cx, cy, flashes[i].r + age * 10, 0.5 * (1 - age), true);
  }
  const dirs = d.seg.directions;
  if (!dirs) {
    for (let i = 0; i < 4; i++) {
      const a = -Math.PI / 4 + (i * Math.PI) / 2;
      dot(cx + Math.cos(a) * ANCHOR, cy + Math.sin(a) * ANCHOR, 2, 0.25 + 0.25 * Math.sin(time * 3 + i));
    }
  } else {
    anglesFor(dirs.length).forEach((a, i) => {
      const w = d.weights[i] ?? 0;
      const ax = cx + Math.cos(a) * ANCHOR, ay = cy + Math.sin(a) * ANCHOR;
      ctx.strokeStyle = `rgba(233,203,139,${0.05 + 0.5 * w})`;
      ctx.lineWidth = 0.6 + 1.2 * w;
      ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * RINGS[0], cy + Math.sin(a) * RINGS[0]); ctx.lineTo(ax, ay); ctx.stroke();
      ring(ax, ay, 3.5 + 4 * w, 0.3 + 0.7 * w, w > 0.2);
    });
  }
  if (d.level) {
    ctx.strokeStyle = "rgba(233,203,139,0.55)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(d.x, d.y); ctx.stroke();
  }
  dot(cx, cy, 2, 0.6);
  star(d.x, d.y, 1.6 + 0.6 * d.level, 0.95, time);
}

function drawConstellation(time) {
  const e = skyT * skyT * (3 - 2 * skyT);
  const pts = commitOrder.map((id, k) => {
    const seg = segs[id];
    if (!seg?.choice) return null;
    const rest = anchorOf(seg);
    const X = (seg.choice.cx - W / 2) * 0.9 + seg.choice.dx * 1.2, Y = (seg.choice.cy - H / 2) * 0.6 + seg.choice.dy * 1.2;
    const Z = (k - (commitOrder.length - 1) / 2) * 190;
    const x1 = X * Math.cos(angle) + Z * Math.sin(angle), z1 = -X * Math.sin(angle) + Z * Math.cos(angle);
    const p = 1000 / (1000 + z1);
    return { x: rest.x + (W / 2 + x1 * p - rest.x) * e, y: rest.y + (H * 0.36 + Y * p - rest.y) * e, p, label: seg.choice.label, level: seg.choice.level };
  }).filter(Boolean);
  ctx.lineWidth = 0.7;
  for (let i = 1; i < pts.length; i++) {
    ctx.strokeStyle = `rgba(235,231,222,${0.35 * e})`;
    ctx.beginPath(); ctx.moveTo(pts[i - 1].x, pts[i - 1].y); ctx.lineTo(pts[i].x, pts[i].y); ctx.stroke();
  }
  ctx.font = "300 11px 'IBM Plex Mono', monospace";
  ctx.textAlign = "center";
  for (const pt of pts) {
    star(pt.x, pt.y, (1.6 + 0.5 * pt.level) * pt.p, Math.min(1, 0.5 + 0.5 * pt.p) * e, time);
    ctx.fillStyle = `rgba(235,231,222,${0.55 * e * pt.p})`;
    ctx.fillText(pt.label, pt.x, pt.y - 18 * pt.p);
  }
}

function dot(x, y, r, a, gold) { ctx.fillStyle = gold ? `rgba(233,203,139,${a})` : `rgba(235,231,222,${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill(); }
function ring(x, y, r, a, gold) { ctx.strokeStyle = gold ? `rgba(233,203,139,${a})` : `rgba(235,231,222,${a})`; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.stroke(); }
function star(x, y, size, alpha, t) {
  const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 9);
  glow.addColorStop(0, `rgba(244,239,228,${0.3 * alpha})`);
  glow.addColorStop(1, "rgba(244,239,228,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, size * 9, 0, 6.28); ctx.fill();
  dot(x, y, size, alpha * (0.85 + 0.15 * Math.sin(t * 2.1)));
  ctx.strokeStyle = `rgba(244,239,228,${0.3 * alpha})`; ctx.lineWidth = 0.6;
  ctx.beginPath(); ctx.moveTo(x - size * 3.2, y); ctx.lineTo(x + size * 3.2, y); ctx.moveTo(x, y - size * 3.2); ctx.lineTo(x, y + size * 3.2); ctx.stroke();
}

function createSound() {
  let ac = null, master = null, voices = [];
  let muted = false;
  try { muted = localStorage.getItem("feeling-sound") === "off"; } catch {}
  function wake() {
    if (muted) return;
    if (!ac) {
      ac = new AudioContext();
      master = ac.createGain(); master.gain.value = 0.8;
      const soften = ac.createBiquadFilter(); soften.type = "lowpass"; soften.frequency.value = 1600;
      master.connect(soften).connect(ac.destination);
    }
    ac.resume();
  }
  function setVoices(n) {
    if (!ac) return;
    for (const v of voices) { v.gain.gain.setTargetAtTime(0, ac.currentTime, 0.08); v.osc.stop(ac.currentTime + 0.6); }
    voices = [];
    if (muted) return;
    voices = NOTES.slice(0, n).map((freq) => {
      const osc = ac.createOscillator(), gain = ac.createGain();
      osc.type = "sine"; osc.frequency.value = freq / 2; gain.gain.value = 0;
      osc.connect(gain).connect(master); osc.start();
      return { osc, gain };
    });
  }
  function mix(weights) {
    if (!ac || muted) return;
    voices.forEach((v, i) => v.gain.gain.setTargetAtTime((weights[i] ?? 0) * 0.09, ac.currentTime, 0.06));
  }
  function blip(freq, peak, length, delay = 0) {
    if (!ac || muted) return;
    const osc = ac.createOscillator(), gain = ac.createGain(), at = ac.currentTime + delay;
    osc.type = "sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, at); gain.gain.linearRampToValueAtTime(peak, at + 0.006); gain.gain.exponentialRampToValueAtTime(0.0001, at + length);
    osc.connect(gain).connect(master); osc.start(at); osc.stop(at + length + 0.05);
  }
  return {
    get muted() { return muted; },
    wake, voices: setVoices, mix,
    tick: (level) => blip(700 + level * 220, 0.05, 0.07),
    chime: (level) => { blip(659.25, 0.06, 0.6); blip(987.77, 0.04 + 0.01 * level, 0.9, 0.09); },
    toggle() {
      muted = !muted;
      try { localStorage.setItem("feeling-sound", muted ? "off" : "on"); } catch {}
      if (muted) setVoices(0); else wake();
    },
  };
}

function diffWords(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = [];
  let i = 0, j = 0;
  while (j < m) {
    if (i < n && A[i] === B[j]) { out.push({ text: B[j], changed: false }); i++; j++; }
    else if (i < n && L[i + 1][j] >= L[i][j + 1]) i++;
    else { out.push({ text: B[j], changed: /\S/.test(B[j]) }); j++; }
  }
  return out;
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }
</script>
